spring.application.name=Myanmar Tea Shop POS
server.port=8080
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/tea_shop_pos?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Yangon&characterEncoding=UTF-8}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=true
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Yangon
spring.sql.init.mode=never
spring.jackson.time-zone=Asia/Yangon
spring.web.resources.cache.cachecontrol.max-age=0
server.servlet.session.timeout=8h
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
app.owner.username=${OWNER_USERNAME:owner}
app.owner.password=${OWNER_PASSWORD:owner123}
